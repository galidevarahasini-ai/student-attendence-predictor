<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Attendance Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN PAGE
    ========================= */

    .auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .login-card h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    .login-card p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #444;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: #5568d9;
    }

    .error-message {
      color: #e53935;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    /* =========================
       DETAILS PAGE
    ========================= */

    .details-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f4f7fb;
    }

    .details-card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .details-card h2 {
      margin-bottom: 10px;
    }

    .details-card .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    /* =========================
       MAIN APP
    ========================= */

    .app-page {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: #20263e;
      color: white;
      min-height: 100vh;
      padding: 25px 15px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      font-size: 21px;
    }

    .logo p {
      font-size: 12px;
      color: #b9bfd5;
      margin-top: 5px;
    }

    .nav-btn {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 8px;
      background: transparent;
      color: #dce0ef;
      text-align: left;
      border-radius: 10px;
      font-size: 15px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #667eea;
      color: white;
    }

    .logout-btn {
      margin-top: 30px;
      background: #e53935;
      color: white;
    }

    .main-content {
      margin-left: 240px;
      width: calc(100% - 240px);
      padding: 30px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .top-bar h1 {
      font-size: 28px;
    }

    .student-name {
      color: #667eea;
      font-weight: bold;
    }

    /* =========================
       REMINDER
    ========================= */

    .reminder {
      background: #fff7d6;
      border: 1px solid #f0d66a;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .reminder h3 {
      margin-bottom: 8px;
    }

    .reminder p {
      color: #666;
      margin-bottom: 14px;
    }

    .reminder-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .yes-btn,
    .no-btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .yes-btn {
      background: #2e7d32;
      color: white;
    }

    .no-btn {
      background: #eeeeee;
      color: #333;
    }

    /* =========================
       DASHBOARD CARDS
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .card h3 {
      color: #777;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .big-number {
      font-size: 30px;
      font-weight: bold;
      color: #667eea;
    }

    .status {
      margin-top: 8px;
      font-weight: bold;
    }

    .good {
      color: #2e7d32;
    }

    .warning {
      color: #f57c00;
    }

    .danger {
      color: #d32f2f;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      margin-bottom: 25px;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    /* =========================
       ATTENDANCE
    ========================= */

    .attendance-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .attendance-input {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .attendance-input label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .attendance-input input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .calculate-btn {
      margin-top: 20px;
      padding: 13px 25px;
      background: #667eea;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: #f1f3ff;
    }

    .result-box h3 {
      margin-bottom: 8px;
    }

    /* =========================
       DAILY MONITOR
    ========================= */

    .class-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      gap: 10px;
    }

    .class-info h3 {
      margin-bottom: 4px;
    }

    .class-info p {
      color: #777;
      font-size: 13px;
    }

    .attendance-actions {
      display: flex;
      gap: 8px;
    }

    .present-btn,
    .absent-btn {
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: bold;
    }

    .present-btn {
      background: #2e7d32;
      color: white;
    }

    .absent-btn {
      background: #e53935;
      color: white;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-item span {
      color: #777;
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .profile-item strong {
      font-size: 16px;
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-nav {
      display: none;
    }

    @media (max-width: 800px) {

      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
        padding-bottom: 90px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .attendance-grid {
        grid-template-columns: 1fr;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #20263e;
        padding: 8px;
        z-index: 100;
        justify-content: space-around;
      }

      .mobile-nav button {
        background: transparent;
        color: white;
        padding: 8px;
        font-size: 12px;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .class-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN PAGE
  ========================== -->

  <div id="loginPage" class="auth-page">

    <div class="login-card">

      <h1>🎓 Student Attendance</h1>

      <p>Login to manage your attendance</p>

      <div class="input-group">
        <label for="loginUsername">Username</label>
        <input
          type="text"
          id="loginUsername"
          placeholder="Enter username"
        >
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password"
        >
      </div>

      <button id="loginButton" class="primary-btn">
        Login
      </button>

      <div id="loginError" class="error-message"></div>

    </div>

  </div>


  <!-- =========================
       STUDENT DETAILS PAGE
  ========================== -->

  <div id="detailsPage" class="details-page hidden">

    <div class="details-card">

      <h2>👋 Welcome!</h2>

      <p class="subtitle">
        Enter your student details to continue.
      </p>

      <div class="input-group">
        <label for="studentNameInput">Student Name</label>
        <input
          type="text"
          id="studentNameInput"
          placeholder="Enter your name"
        >
      </div>

      <div class="input-group">
        <label for="studentIdInput">Student ID</label>
        <input
          type="text"
          id="studentIdInput"
          placeholder="Enter student ID"
        >
      </div>

      <div class="input-group">
        <label for="branchInput">Branch</label>
        <input
          type="text"
          id="branchInput"
          placeholder="Example: CSE"
        >
      </div>

      <div class="input-group">
        <label for="yearInput">Year</label>

        <select id="yearInput">
          <option value="">Select Year</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>

      </div>

      <button id="continueButton" class="primary-btn">
        Continue
      </button>

      <div id="detailsError" class="error-message"></div>

    </div>

  </div>


  <!-- =========================
       MAIN APP
  ========================== -->

  <div id="appPage" class="app-page hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">
        <h2>🎓 Attendance</h2>
        <p>Student Attendance Calculator</p>
      </div>

      <button class="nav-btn active" data-page="dashboard">
        🏠 Dashboard
      </button>

      <button class="nav-btn" data-page="attendance">
        📊 Attendance
      </button>

      <button class="nav-btn" data-page="daily">
        🔔 Daily Monitor
      </button>

      <button class="nav-btn" data-page="profile">
        👤 Profile
      </button>

      <button id="logoutButton" class="nav-btn logout-btn">
        🚪 Logout
      </button>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

      <div class="top-bar">

        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p>
            Welcome,
            <span id="topStudentName" class="student-name">
              Student
            </span>
          </p>
        </div>

      </div>

      <div id="contentArea"></div>

    </main>


    <!-- MOBILE NAV -->

    <nav class="mobile-nav">

      <button data-page="dashboard">
        🏠<br>Home
      </button>

      <button data-page="attendance">
        📊<br>Attendance
      </button>

      <button data-page="daily">
        🔔<br>Daily
      </button>

      <button data-page="profile">
        👤<br>Profile
      </button>

    </nav>

  </div>


  <script>

    /* ==================================================
       DATA
    ================================================== */

    let studentData = {
      name: "",
      id: "",
      branch: "",
      year: ""
    };

    let attendanceData = {
      conducted: 0,
      attended: 0
    };

    let dailyClasses = [];


    /* ==================================================
       ELEMENTS
    ================================================== */

    const loginPage = document.getElementById("loginPage");
    const detailsPage = document.getElementById("detailsPage");
    const appPage = document.getElementById("appPage");

    const loginButton = document.getElementById("loginButton");
    const continueButton = document.getElementById("continueButton");
    const logoutButton = document.getElementById("logoutButton");

    const loginError = document.getElementById("loginError");
    const detailsError = document.getElementById("detailsError");

    const contentArea = document.getElementById("contentArea");
    const pageTitle = document.getElementById("pageTitle");
    const topStudentName = document.getElementById("topStudentName");


    /* ==================================================
       LOAD SAVED DATA
    ================================================== */

    function loadData() {

      const savedStudent =
        localStorage.getItem("studentAttendanceStudent");

      const savedAttendance =
        localStorage.getItem("studentAttendanceData");

      const savedDaily =
        localStorage.getItem("studentAttendanceDaily");

      if (savedStudent) {
        studentData = JSON.parse(savedStudent);
      }

      if (savedAttendance) {
        attendanceData = JSON.parse(savedAttendance);
      }

      if (savedDaily) {
        dailyClasses = JSON.parse(savedDaily);
      }
    }


    /* ==================================================
       SAVE DATA
    ================================================== */

    function saveData() {

      localStorage.setItem(
        "studentAttendanceStudent",
        JSON.stringify(studentData)
      );

      localStorage.setItem(
        "studentAttendanceData",
        JSON.stringify(attendanceData)
      );

      localStorage.setItem(
        "studentAttendanceDaily",
        JSON.stringify(dailyClasses)
      );
    }


    /* ==================================================
       LOGIN
    ================================================== */

    function handleLogin() {

      const username =
        document.getElementById("loginUsername").value.trim();

      const password =
        document.getElementById("loginPassword").value.trim();

      loginError.textContent = "";

      if (username === "" || password === "") {

        loginError.textContent =
          "Please enter username and password.";

        return;
      }

      /*
        Demo login:
        Any non-empty username/password is accepted.
      */

      loginPage.classList.add("hidden");

      if (
        studentData.name !== "" &&
        studentData.id !== ""
      ) {

        showApp();

      } else {

        detailsPage.classList.remove("hidden");

      }
    }


    /* ==================================================
       STUDENT DETAILS
    ================================================== */

    function saveStudentDetails() {

      const name =
        document.getElementById("studentNameInput").value.trim();

      const id =
        document.getElementById("studentIdInput").value.trim();

      const branch =
        document.getElementById("branchInput").value.trim();

      const year =
        document.getElementById("yearInput").value;

      detailsError.textContent = "";

      if (
        name === "" ||
        id === "" ||
        branch === "" ||
        year === ""
      ) {

        detailsError.textContent =
          "Please fill all details.";

        return;
      }

      studentData = {
        name: name,
        id: id,
        branch: branch,
        year: year
      };

      saveData();

      detailsPage.classList.add("hidden");

      showApp();
    }


    /* ==================================================
       SHOW APP
    ================================================== */

    function showApp() {

      loginPage.classList.add("hidden");
      detailsPage.classList.add("hidden");
      appPage.classList.remove("hidden");

      topStudentName.textContent =
        studentData.name || "Student";

      renderPage("dashboard");
    }


    /* ==================================================
       LOGOUT
    ================================================== */

    function handleLogout() {

      appPage.classList.add("hidden");

      loginPage.classList.remove("hidden");

      document.getElementById("loginUsername").value = "";
      document.getElementById("loginPassword").value = "";

      loginError.textContent = "";
    }


    /* ==================================================
       ATTENDANCE PERCENTAGE
    ================================================== */

    function getPercentage() {

      if (attendanceData.conducted <= 0) {
        return 0;
      }

      return (
        attendanceData.attended /
        attendanceData.conducted
      ) * 100;
    }


    /* ==================================================
       ATTENDANCE STATUS
    ================================================== */

    function getStatus() {

      const percentage = getPercentage();

      if (percentage >= 75) {
        return {
          text: "Good Attendance",
          className: "good"
        };
      }

      if (percentage >= 65) {
        return {
          text: "Attendance is Low",
          className: "warning"
        };
      }

      return {
        text: "Attendance is Very Low",
        className: "danger"
      };
    }


    /* ==================================================
       PAGE NAVIGATION
    ================================================== */

    function renderPage(page) {

      const buttons =
        document.querySelectorAll(".nav-btn[data-page]");

      buttons.forEach(function(button) {

        button.classList.remove("active");

        if (button.dataset.page === page) {
          button.classList.add("active");
        }

      });

      if (page === "dashboard") {

        pageTitle.textContent = "Dashboard";

        renderDashboard();

      }

      else if (page === "attendance") {

        pageTitle.textContent = "Attendance";

        renderAttendance();

      }

      else if (page === "daily") {

        pageTitle.textContent = "Daily Monitor";

        renderDailyMonitor();

      }

      else if (page === "profile") {

        pageTitle.textContent = "Profile";

        renderProfile();

      }
    }


    /* ==================================================
       DASHBOARD
    ================================================== */

    function renderDashboard() {

      const percentage =
        getPercentage();

      const status =
        getStatus();

      contentArea.innerHTML = `

        <div class="reminder">

          <h3>🔔 Today's Attendance Reminder</h3>

          <p>
            Did you attend today's classes?
          </p>

          <div class="reminder-buttons">

            <button
              class="yes-btn"
              id="dashboardYes"
            >
              Yes, I attended
            </button>

            <button
              class="no-btn"
              id="dashboardNo"
            >
              No, I didn't
            </button>

          </div>

        </div>


        <div class="cards">

          <div class="card">

            <h3>Total Classes</h3>

            <div class="big-number">
              ${attendanceData.conducted}
            </div>

          </div>


          <div class="card">

            <h3>Classes Attended</h3>

            <div class="big-number">
              ${attendanceData.attended}
            </div>

          </div>


          <div class="card">

            <h3>Attendance Percentage</h3>

            <div class="big-number">
              ${percentage.toFixed(2)}%
            </div>

            <div class="status ${status.className}">
              ${status.text}
            </div>

          </div>

        </div>


        <div class="section">

          <h2>📌 Quick Overview</h2>

          <p>
            Use the Attendance page to calculate your
            attendance percentage.
          </p>

          <br>

          <p>
            Use Daily Monitor to record whether you
            attended each class.
          </p>

        </div>
      `;


      document
        .getElementById("dashboardYes")
        .addEventListener("click", function() {

          renderPage("daily");

        });


      document
        .getElementById("dashboardNo")
        .addEventListener("click", function() {

          alert("Okay! Today's classes are not added.");

        });

    }


    /* ==================================================
       ATTENDANCE PAGE
    ================================================== */

    function renderAttendance() {

      contentArea.innerHTML = `

        <div class="section">

          <h2>📊 Attendance Calculator</h2>

          <p>
            Enter your total conducted classes and
            attended classes.
          </p>


          <div class="attendance-grid">

            <div class="attendance-input">

              <label>
                Total Classes Conducted
              </label>

              <input
                type="number"
                id="conductedInput"
                min="0"
                value="${attendanceData.conducted}"
              >

            </div>


            <div class="attendance-input">

              <label>
                Classes Attended
              </label>

              <input
                type="number"
                id="attendedInput"
                min="0"
                value="${attendanceData.attended}"
              >

            </div>

          </div>


          <button
            class="calculate-btn"
            id="calculateAttendance"
          >
            Calculate Attendance
          </button>


          <div
            id="attendanceResult"
            class="result-box"
          >

            <h3>
              Current Attendance:
              ${getPercentage().toFixed(2)}%
            </h3>

            <p>
              ${getStatus().text}
            </p>

          </div>

        </div>


        <div class="section">

          <h2>💡 How it works</h2>

          <p>
            Attendance % =
            (Classes Attended ÷ Total Classes Conducted)
            × 100
          </p>

        </div>
      `;


      document
        .getElementById("calculateAttendance")
        .addEventListener("click", function() {

          const conducted =
            Number(
              document.getElementById("conductedInput").value
            );

          const attended =
            Number(
              document.getElementById("attendedInput").value
            );


          if (conducted < 0 || attended < 0) {

            alert("Numbers cannot be negative.");

            return;
          }


          if (attended > conducted) {

            alert(
              "Attended classes cannot be greater than conducted classes."
            );

            return;
          }


          attendanceData.conducted = conducted;
          attendanceData.attended = attended;

          saveData();

          renderAttendance();

        });

    }


    /* ==================================================
       DAILY MONITOR
    ================================================== */

    function renderDailyMonitor() {

      if (dailyClasses.length === 0) {

        dailyClasses = [
          {
            subject: "Class 1",
            time: "Morning",
            status: ""
          },
          {
            subject: "Class 2",
            time: "Morning",
            status: ""
          },
          {
            subject: "Class 3",
            time: "Afternoon",
            status: ""
          },
          {
            subject: "Class 4",
            time: "Afternoon",
            status: ""
          }
        ];

        saveData();
      }


      let classHTML = "";


      dailyClasses.forEach(function(item, index) {

        let statusText = "Not marked";

        if (item.status === "present") {
          statusText = "✅ Present";
        }

        if (item.status === "absent") {
          statusText = "❌ Absent";
        }


        classHTML += `

          <div class="class-row">

            <div class="class-info">

              <h3>
                ${item.subject}
              </h3>

              <p>
                ${item.time} · ${statusText}
              </p>

            </div>


            <div class="attendance-actions">

              <button
                class="present-btn"
                data-index="${index}"
                data-status="present"
              >
                Present
              </button>

              <button
                class="absent-btn"
                data-index="${index}"
                data-status="absent"
              >
                Absent
              </button>

            </div>

          </div>
        `;
      });


      contentArea.innerHTML = `

        <div class="section">

          <h2>🔔 Today's Classes</h2>

          <p style="margin-bottom:20px;">
            Select Present or Absent for each class.
          </p>

          ${classHTML}

        </div>


        <div class="section">

          <h2>➕ Add Today's Class</h2>

          <div class="input-group">

            <label>
              Subject
            </label>

            <input
              type="text"
              id="newSubject"
              placeholder="Example: Mathematics"
            >

          </div>


          <div class="input-group">

            <label>
              Time
            </label>

            <input
              type="text"
              id="newTime"
              placeholder="Example: 10:00 AM"
            >

          </div>


          <button
            class="calculate-btn"
            id="addClassButton"
          >
            Add Class
          </button>

        </div>
      `;


      document
        .querySelectorAll(
          ".present-btn, .absent-btn"
        )
        .forEach(function(button) {

          button.addEventListener(
            "click",
            function() {

              const index =
                Number(button.dataset.index);

              const status =
                button.dataset.status;

              dailyClasses[index].status =
                status;

              saveData();

              renderDailyMonitor();

            }
          );

        });


      document
        .getElementById("addClassButton")
        .addEventListener("click", function() {

          const subject =
            document.getElementById("newSubject")
              .value
              .trim();

          const time =
            document.getElementById("newTime")
              .value
              .trim();


          if (subject === "") {

            alert("Please enter subject name.");

            return;
          }


          dailyClasses.push({

            subject: subject,

            time: time || "Time not specified",

            status: ""

          });


          saveData();

          renderDailyMonitor();

        });

    }


    /* ==================================================
       PROFILE
    ================================================== */

    function renderProfile() {

      contentArea.innerHTML = `

        <div class="section">

          <h2>👤 Student Profile</h2>


          <div class="profile-item">

            <span>Name</span>

            <strong>
              ${studentData.name || "-"}
            </strong>

          </div>


          <div class="profile-item">

            <span>Student ID</span>

            <strong>
              ${studentData.id || "-"}
            </strong>

          </div>


          <div class="profile-item">

            <span>Branch</span>

            <strong>
              ${studentData.branch || "-"}
            </strong>

          </div>


          <div class="profile-item">

            <span>Year</span>

            <strong>
              ${studentData.year || "-"}
            </strong>

          </div>

        </div>
      `;
    }


    /* ==================================================
       NAVIGATION EVENTS
    ================================================== */

    document
      .querySelectorAll("[data-page]")
      .forEach(function(button) {

        button.addEventListener("click", function() {

          const page =
            button.dataset.page;

          renderPage(page);

        });

      });


    /* ==================================================
       BUTTON EVENTS
    ================================================== */

    loginButton.addEventListener(
      "click",
      handleLogin
    );


    continueButton.addEventListener(
      "click",
      saveStudentDetails
    );


    logoutButton.addEventListener(
      "click",
      handleLogout
    );


    /* ==================================================
       ENTER KEY LOGIN
    ================================================== */

    document
      .getElementById("loginPassword")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          handleLogin();

        }

      });


    /* ==================================================
       START
    ================================================== */

    loadData();

  </script>

</body>
</html>
