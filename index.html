<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Attendance Predictor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fb;
    color:#222;
}

/* =========================
   COMMON
========================= */

.hidden{
    display:none !important;
}

button{
    border:none;
    cursor:pointer;
}

input, select{
    outline:none;
}

/* =========================
   LOGIN / AUTH
========================= */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
}

.auth-card{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(0,0,0,0.10);
}

.logo{
    width:70px;
    height:70px;
    border-radius:18px;
    background:#4d83ff;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin:0 auto 20px;
}

.auth-card h1{
    text-align:center;
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    line-height:1.5;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#4d83ff;
}

.primary-btn{
    width:100%;
    padding:14px;
    background:#4d83ff;
    color:white;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

.primary-btn:hover{
    background:#386fe8;
}

.secondary-btn{
    padding:12px 18px;
    background:#eef3ff;
    color:#376de5;
    border-radius:10px;
    font-weight:bold;
}

.auth-link{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:14px;
}

.auth-link span{
    color:#4d83ff;
    cursor:pointer;
    font-weight:bold;
}

   APP
